name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci --ignore-scripts

      - name: Typecheck main + preload + shared
        run: npm run typecheck:main

      - name: Typecheck renderer
        run: npm run typecheck:renderer

      - name: Build main process
        run: npm run build:main

      - name: Build renderer
        run: npm run build:renderer

      - name: Verify build artifacts
        run: |
          test -f dist/main/main.js
          test -f dist/preload/preload.js
          test -f dist/renderer/index.html
          echo "Build artifacts OK"
